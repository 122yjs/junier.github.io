name: Apply Central Drive OAuth Payload

on:
  push:
    branches:
      - feat/google-drive-oauth-central
    paths:
      - .central-drive-payload.tar.gz.b64
      - .github/workflows/apply-central-drive-payload.yml
  pull_request:
    branches:
      - main
    paths:
      - .central-drive-payload.tar.gz.b64
      - .github/workflows/apply-central-drive-payload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-drive-oauth-central

      - name: Expand reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          cp .central-drive-payload.tar.gz.b64 /tmp/central-drive-payload.tar.gz
          tar -xzf /tmp/central-drive-payload.tar.gz -C .
          mapfile -t remove_paths < .central-drive-remove-list
          rm -f "${remove_paths[@]}" .central-drive-remove-list /tmp/central-drive-payload.tar.gz

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add central Google Drive OAuth storage"
          git push origin HEAD:feat/google-drive-oauth-central
